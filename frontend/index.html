<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S Mobile Edition</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="jarvis-wrap">
    <h1 class="header-title">J.A.R.V.I.S</h1>
    <div class="header-sub">MOBILE EDITION</div>

    <div class="orb-container" id="jarvisOrb">
      <div class="orb-ring"></div>
      <div class="orb-core"></div>
    </div>
    <div class="core-label" id="coreLabel">CORE ACTIVE</div>

    <div class="status-box">
      <div class="status-heading">SYSTEM STATUS</div>
      <div class="status-row"><span>AI CORE</span><span class="status-online" id="coreStatus">● ONLINE</span></div>
      <div class="status-row"><span>NETWORK</span><span class="status-online" id="netStatus">● ONLINE</span></div>
      <div class="status-row"><span>VOICE</span><span class="status-ready" id="voiceStatus">● READY</span></div>
      <div class="status-row"><span>MEMORY</span><span class="status-online" id="memStatus">● ACTIVE</span></div>
      <div class="status-row"><span>WAKE WORD</span><span class="status-off" id="wakeStatus">WAKE OFF</span></div>
    </div>

    <div class="api-row">
      <input type="password" id="geminiApiKey" placeholder="Paste Gemini API Key" autocomplete="off" />
      <button type="button" id="saveKeyBtn">SAVE KEY</button>
    </div>

    <div class="meta-line" id="docStatus">No document attached</div>

    <div class="chat-box" id="chatLog"></div>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="Hey jarvis" />
      <button type="button" id="sendBtn">SEND</button>
    </div>

    <div class="btn-grid">
      <button type="button" id="docUploadBtn">DOC</button>
      <button type="button" id="micBtn">MIC</button>
      <button type="button" id="camBtn">CAM</button>
      <button type="button" id="wakeBtn">WAKE</button>
      <button type="button" id="clearBtn">CLEAR</button>
    </div>

    <input type="file" id="docFileInput" accept=".pdf,.txt,.csv,.json,.md,.log" hidden />
  </div>

  <script src="./script.js"></script>
</body>
</html>
