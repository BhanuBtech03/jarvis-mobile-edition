<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S // Holographic HUD</title>
  <style>
    :root {
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.28);
      --gold: #ffae00;
      --gold-dim: rgba(255, 174, 0, 0.35);
      --red: #ff3b5c;
      --green: #00ff9d;
      --panel: rgba(5, 19, 36, 0.72);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Consolas", "Courier New", monospace;
    }

    body {
      background:
        radial-gradient(circle at 50% 25%, rgba(0, 240, 255, 0.14), transparent 55%),
        linear-gradient(180deg, #020813 0%, #051124 55%, #02060f 100%);
      color: #dffaff;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      position: relative;
    }

    /* Subtle holographic scanline grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
      z-index: 0;
    }

    .hud-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      gap: 8px;
      overflow: hidden;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--cyan-dim);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      flex-shrink: 0;
    }

    .brand {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.65);
    }

    .status-badge {
      font-size: 0.66rem;
      padding: 3px 8px;
      border-radius: 3px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .status-badge.offline {
      background: rgba(255, 59, 92, 0.16);
      color: #ff7b93;
      border: 1px solid rgba(255, 59, 92, 0.55);
    }

    .status-badge.online {
      background: rgba(0, 255, 157, 0.15);
      color: var(--green);
      border: 1px solid rgba(0, 255, 157, 0.55);
    }

    .api-bar {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .api-bar input {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--cyan-dim);
      color: #fff;
      padding: 6px 9px;
      border-radius: 4px;
      font-size: 0.78rem;
      outline: none;
    }

    .api-bar input:focus,
    .text-cmd-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }

    .api-bar button {
      background: rgba(0, 240, 255, 0.14);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .core-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    /* Holographic Arc Reactor + Telemetry SVG */
    .arc-reactor {
      position: relative;
      width: 146px;
      height: 146px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hud-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hud-svg .ring-outer {
      transform-origin: 100px 100px;
      animation: spinCW 14s linear infinite;
    }

    .hud-svg .ring-ticks {
      transform-origin: 100px 100px;
      animation: spinCCW 9s linear infinite;
    }

    .hud-svg .ring-inner {
      transform-origin: 100px 100px;
      animation: spinCW 4.5s linear infinite;
    }

    .core-nucleus {
      position: relative;
      z-index: 2;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #6ef7ff 38%, rgba(0, 153, 255, 0.25) 75%, transparent 100%);
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.85), inset 0 0 14px rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .arc-reactor.listening .hud-svg .ring-outer,
    .arc-reactor.listening .hud-svg .ring-inner {
      stroke: var(--gold);
      animation-duration: 2.2s;
    }

    .arc-reactor.listening .core-nucleus {
      background: radial-gradient(circle, #fff8dc 0%, #ffbe2e 42%, rgba(255, 115, 0, 0.3) 78%, transparent 100%);
      border-color: var(--gold);
      box-shadow: 0 0 28px rgba(255, 174, 0, 0.95), inset 0 0 14px rgba(255, 255, 255, 0.8);
    }

    .arc-reactor.thinking .core-nucleus {
      animation: reactorPulse 0.65s ease-in-out infinite alternate;
      border-color: #7df9ff;
    }

    .state-label {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #03111f;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
    }

    .wake-hint {
      font-size: 0.72rem;
      color: #7eeeff;
      letter-spacing: 0.6px;
      text-align: center;
      flex-shrink: 0;
    }

    .output-box {
      width: 100%;
      flex: 1;
      min-height: 75px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--cyan-dim);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg {
      padding: 6px 9px;
      border-radius: 4px;
      font-size: 0.78rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .msg.user {
      background: rgba(0, 176, 255, 0.16);
      border-right: 2.5px solid #00b0ff;
      align-self: flex-end;
      max-width: 90%;
    }

    .msg.jarvis {
      background: rgba(0, 240, 255, 0.1);
      border-left: 2.5px solid var(--cyan);
    }

    .msg.warn {
      background: rgba(255, 174, 0, 0.15);
      border-left: 2.5px solid var(--gold);
      color: #ffd875;
    }

    .msg.system {
      font-size: 0.72rem;
      color: #82b8c4;
    }

    .control-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .action-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn {
      padding: 8px 10px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.8px;
      font-size: 0.78rem;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn.secondary {
      flex: 1;
      background: rgba(0, 240, 255, 0.12);
      color: var(--cyan);
      border: 1px solid var(--cyan-dim);
    }

    .btn.primary {
      flex: 1.4;
      background: rgba(0, 240, 255, 0.24);
      color: #ffffff;
      border: 1px solid var(--cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    .btn.send {
      background: rgba(0, 255, 157, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
      flex-shrink: 0;
    }

    .text-cmd-group {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .text-cmd-group input {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--cyan-dim);
      color: #ffffff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.82rem;
      outline: none;
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes reactorPulse {
      from { transform: scale(0.92); filter: brightness(0.9); }
      to { transform: scale(1.08); filter: brightness(1.3); }
    }
  </style>
</head>
<body>
  <div class="hud-container">
    <header class="hud-header">
      <div class="brand">J.A.R.V.I.S // MK-VII</div>
      <div id="pcStatusBadge" class="status-badge offline">PC BRIDGE: OFFLINE</div>
    </header>

    <div class="api-bar">
      <input id="apiKeyInput" type="password" placeholder="Gemini API Key (gemini-3.5-flash)" />
      <button id="saveKeyBtn" type="button">Save Key</button>
    </div>

    <main class="core-stage">
      <div id="arcReactor" class="arc-reactor idle" aria-label="J.A.R.V.I.S Core">
        <svg class="hud-svg" viewBox="0 0 200 200">
          <circle class="ring-outer" cx="100" cy="100" r="88" fill="none" stroke="#00f0ff" stroke-width="1.6" stroke-dasharray="26 10 8 10" opacity="0.85" />
          <circle class="ring-ticks" cx="100" cy="100" r="72" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="3 9" opacity="0.7" />
          <circle class="ring-inner" cx="100" cy="100" r="54" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="48 16 14 16" opacity="0.95" />
          <path d="M18 38 L18 18 L38 18 M162 18 L182 18 L182 38 M18 162 L18 182 L38 182 M162 182 L182 182 L182 162" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.65" />
        </svg>
        <div class="core-nucleus">
          <span id="stateLabel" class="state-label">STANDBY</span>
        </div>
      </div>

      <p id="wakeHint" class="wake-hint">SAY "HEY JARVIS" OR ENTER COMMAND</p>

      <div id="outputBox" class="output-box">
        <div class="msg system">HUD online. Mobile tools ready; laptop bridge scheduled for tonight.</div>
      </div>
    </main>

    <footer class="control-bar">
      <div class="action-row">
        <button id="wakeToggleBtn" type="button" class="btn secondary">Wake: ON</button>
        <button id="micBtn" type="button" class="btn primary">Speak</button>
      </div>
      <div class="text-cmd-group">
        <input id="cmdInput" type="text" placeholder="Type command (e.g., set timer 2 min, open youtube)..." autocomplete="off" />
        <button id="sendCmdBtn" type="button" class="btn send">Send</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
