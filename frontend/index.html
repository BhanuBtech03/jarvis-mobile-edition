<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S Mobile Edition</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="jarvis-app">
    <h1>J.A.R.V.I.S</h1>
    <p class="subtitle">MOBILE EDITION</p>

    <!-- API Key Setup Bar -->
    <div class="api-bar" style="display:flex; gap:8px; margin:10px 0; flex-wrap:wrap;">
      <input
        type="password"
        id="apiKeyInput"
        placeholder="Enter Gemini API Key..."
        style="flex:1; min-width:180px; padding:8px; background:#041518; color:#00f7ff; border:1px solid #00a8b5;"
      />
      <button type="button" id="saveApiKeyBtn">SAVE KEY</button>
      <span id="apiKeyStatus" style="font-size:12px; align-self:center; color:#00f7ff;"></span>
    </div>

    <!-- Document Upload Indicator -->
    <div id="docStatus" style="font-size:12px; color:#7ef9ff; margin-bottom:6px;">
      No document attached
    </div>

    <!-- Chat / Output Box -->
    <div id="chatLog" class="chat-log"></div>

    <!-- Input & Controls -->
    <div class="controls" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">
      <input type="text" id="userInput" placeholder="Ask J.A.R.V.I.S..." style="flex:1; min-width:160px; padding:8px;" />
      <button type="button" id="sendBtn">SEND</button>
      <button type="button" id="docBtn">DOC</button>
      <input type="file" id="docInput" accept=".txt,.csv,.json,.md,.log,.xml,.html,.pdf" hidden />
      <button type="button" id="micBtn">MIC</button>
      <button type="button" id="camBtn">CAM</button>
      <button type="button" id="wakeBtn">WAKE</button>
      <button type="button" id="clearBtn">CLEAR</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
