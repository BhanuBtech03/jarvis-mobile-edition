<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S Mobile HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0b192c 0%, #040811 75%);
      color: #e6f7ff;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .hud-container {
      width: 100%;
      max-width: 540px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 229, 255, 0.25);
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00e5ff;
      font-size: 0.92rem;
    }

    .status-badge {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .status-badge.offline {
      background: rgba(255, 82, 82, 0.16);
      color: #ff8a80;
      border: 1px solid rgba(255, 82, 82, 0.45);
    }

    .status-badge.online {
      background: rgba(0, 230, 118, 0.16);
      color: #69f0ae;
      border: 1px solid rgba(0, 230, 118, 0.45);
    }

    .api-bar {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .api-bar input {
      flex: 1;
      min-width: 0;
      background: rgba(10, 25, 47, 0.95);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .api-bar button {
      background: #00838f;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .core-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .arc-reactor {
      position: relative;
      width: 118px;
      height: 118px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px dashed rgba(0, 229, 255, 0.65);
    }

    .outer-ring {
      width: 100%;
      height: 100%;
      animation: spinSlow 10s linear infinite;
    }

    .mid-ring {
      width: 74%;
      height: 74%;
      border-style: solid;
      border-color: rgba(0, 229, 255, 0.9) transparent rgba(0, 229, 255, 0.35) transparent;
      animation: spinReverse 4s linear infinite;
    }

    .core-pulse {
      width: 44%;
      height: 44%;
      border-radius: 50%;
      background: radial-gradient(circle, #00e5ff 0%, #0277bd 80%);
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.8);
    }

    .arc-reactor.listening .outer-ring,
    .arc-reactor.listening .mid-ring {
      animation-duration: 1.5s;
      border-color: #ffab00 transparent #ffab00 transparent;
    }

    .arc-reactor.listening .core-pulse {
      background: radial-gradient(circle, #ffd54f 0%, #ff6f00 85%);
      box-shadow: 0 0 28px rgba(255, 171, 0, 0.9);
    }

    .arc-reactor.thinking .core-pulse {
      animation: pulseFast 0.7s ease-in-out infinite alternate;
    }

    .state-label {
      position: relative;
      z-index: 2;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 6px #000;
    }

    .wake-hint {
      font-size: 0.8rem;
      color: #90caf9;
      text-align: center;
      flex-shrink: 0;
    }

    .output-box {
      width: 100%;
      flex: 1;
      min-height: 80px;
      overflow-y: auto;
      background: rgba(6, 15, 29, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .msg.user {
      background: rgba(0, 176, 255, 0.16);
      border-left: 3px solid #00b0ff;
      align-self: flex-end;
      max-width: 90%;
    }

    .msg.jarvis {
      background: rgba(0, 229, 255, 0.1);
      border-left: 3px solid #00e5ff;
    }

    .msg.warn {
      background: rgba(255, 171, 0, 0.16);
      border-left: 3px solid #ffab00;
      color: #ffe082;
    }

    .msg.system {
      font-size: 0.78rem;
      color: #90a4ae;
    }

    .control-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: 4px;
    }

    .btn {
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .btn.primary {
      background: #00b0ff;
      color: #03101c;
      width: 100%;
    }

    .btn.secondary {
      background: rgba(0, 229, 255, 0.14);
      color: #80deea;
      border: 1px solid rgba(0, 229, 255, 0.35);
      width: 100%;
    }

    .btn.send {
      background: #00e676;
      color: #041b0f;
      flex-shrink: 0;
    }

    .text-cmd-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .text-cmd-group input {
      flex: 1;
      min-width: 0;
      background: rgba(10, 25, 47, 0.95);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes pulseFast {
      from { transform: scale(0.92); opacity: 0.7; }
      to { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="hud-container">
    <header class="hud-header">
      <div class="brand">J.A.R.V.I.S // HUD v3.5</div>
      <div id="pcStatusBadge" class="status-badge offline">PC BRIDGE: OFFLINE</div>
    </header>

    <div class="api-bar">
      <input id="apiKeyInput" type="password" placeholder="Paste Gemini API Key (gemini-3.5-flash)" />
      <button id="saveKeyBtn" type="button">Save Key</button>
    </div>

    <main class="core-stage">
      <div id="arcReactor" class="arc-reactor idle" aria-label="J.A.R.V.I.S Core">
        <div class="ring outer-ring"></div>
        <div class="ring mid-ring"></div>
        <div class="core-pulse"></div>
        <span id="stateLabel" class="state-label">STANDBY</span>
      </div>

      <p id="wakeHint" class="wake-hint">Say "Hey Jarvis" or type a command below</p>

      <div id="outputBox" class="output-box">
        <div class="msg system">System ready. Test mobile tools now; connect laptop tonight.</div>
      </div>
    </main>

    <footer class="control-bar">
      <button id="wakeToggleBtn" type="button" class="btn secondary">Wake: ON</button>
      <button id="micBtn" type="button" class="btn primary">Speak</button>
      <div class="text-cmd-group">
        <input id="cmdInput" type="text" placeholder="Type command (e.g., set timer 2 min, open youtube)..." autocomplete="off" />
        <button id="sendCmdBtn" type="button" class="btn send">Send</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
