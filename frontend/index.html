<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="J.A.R.V.I.S Personal AI Assistant - Mobile Edition">
  <title>J.A.R.V.I.S</title>

  <!-- PWA Support -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>MOBILE EDITION</p>
  </header>

  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="center"></div>
  </div>
  <p class="core-text">CORE ACTIVE</p>

  <div class="status">
    <h2>SYSTEM STATUS</h2>
    <div class="row"><span>AI CORE</span><b class="on" id="ai-status">● ONLINE</b></div>
    <div class="row"><span>NETWORK</span><b class="on" id="net-status">● ONLINE</b></div>
    <div class="row"><span>VOICE</span><b class="off" id="voice-status">● READY</b></div>
    <div class="row"><span>MEMORY</span><b class="on" id="mem-status">● ACTIVE</b></div>
    <div class="row"><span>WAKE WORD</span><b class="off" id="wake-status">WAKE: OFF</b></div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="msg" type="text" placeholder="Ask J.A.R.V.I.S...">
    <button id="send" type="button">SEND</button>
    <button id="mic-btn" type="button">MIC</button>
    <button id="cam-btn" type="button">CAM</button>
    <button id="wake-btn" type="button">WAKE</button>
    <button id="clear-btn" type="button">CLEAR</button>
    <input id="img-input" type="file" accept="image/*" capture="environment" style="display: none;">
  </div>

  <script src="script.js"></script>
</body>
</html>
